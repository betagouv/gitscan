name: Build web data

on:
    workflow_dispatch:
    workflow_call:

jobs:
    build-web-data:
        runs-on: ubuntu-latest
        name: Build web data
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: main

            - name: Pull latest commits
              run: git pull --rebase --autostash

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: web/package-lock.json

            - name: Install dependencies
              working-directory: web
              run: npm ci

            - name: Build web data
              working-directory: web
              run: npm run build:data

            - name: Commit web data
              run: |
                  git config user.name "BetaBot"
                  git config user.email "infra@incubateur.net"
                  git add web/data/

                  if git diff --staged --quiet; then
                    echo "No changes to commit"
                    exit 0
                  fi

                  git commit -m "update: web/data"

                  for i in {1..5}; do
                    git pull --rebase --autostash && git push && break
                    echo "Push failed, retrying ($i/5)..."
                    sleep $((i * 2))
                  done
